<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Diffusion Coefficient Fit</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1b19;--mut:#76736c;--line:#e4e2dc;--card:#fff;--acc:#2f6f5e;--pt:#9a978f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--fg:#ecebe6;--mut:#9a978f;--line:#2c2b28;--card:#1d1d1a;--acc:#6fc1a9;--pt:#77746d}}
:root[data-theme="dark"]{--bg:#161614;--fg:#ecebe6;--mut:#9a978f;--line:#2c2b28;--card:#1d1d1a;--acc:#6fc1a9;--pt:#77746d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}h1{font-size:18px;font-weight:600;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
#drop{border:1.5px dashed var(--line);text-align:center;color:var(--mut);cursor:pointer;padding:22px}#drop.on{border-color:var(--acc);color:var(--fg)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}label{display:block;font-size:12px;color:var(--mut)}
input,select{width:100%;margin-top:3px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.row label{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px}.row input{width:auto;margin:0}
button{padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.res div{padding:10px;border:1px solid var(--line);border-radius:8px}.res b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.res span{font-size:11px;color:var(--mut)}
canvas{width:100%;height:280px;display:block}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:500}
#msg{color:var(--mut);font-size:12px;margin-top:8px}
</style></head><body><main>
<h1>Diffusion Coefficient Fit</h1><p class="sub">ROA file → molar uptake → D/R² and M∞ fit (replaces the Excel Solver workflow)</p>
<div class="card" id="drop">Drop a .ROA file here or click to choose<input type="file" id="fi" accept=".roa,.ROA,.txt,.csv" hidden></div>
<div class="card" id="cfg" hidden>
<div class="g">
<label>Sample<input id="sid" disabled></label>
<label>Point<select id="pt"></select></label>
<label>Sample weight (g)<input id="wt" type="number" step="any"></label>
<label>Tm manifold (°C)<input id="tm" type="number" step="any" value="45.8"></label>
<label>Tr reactor (K)<input id="tr" type="number" step="any" value="353"></label>
<label>Vm manifold (cm³)<input id="vm" type="number" step="any" value="39.5660818710272"></label>
<label>Vr reactor (cm³)<input id="vr" type="number" step="any" value="16"></label>
<label>Pri initial reactor P (Torr)<input id="pri" type="number" step="any" value="0"></label>
<label>R avg (nm)<input id="R" type="number" step="any" value="40.88"></label>
<label>σ (nm)<input id="sg" type="number" step="any" value="0"></label>
</div>
<div class="row"><label><input type="checkbox" id="fs">Also fit σ (bounded 0 to R/3)</label><button class="p" id="go">Fit</button><button id="all">Fit all points</button></div>
<div id="msg"></div></div>
<div class="card" id="out" hidden><div class="res" id="res"></div></div>
<div class="card" id="cc" hidden><canvas id="cv"></canvas></div>
<div class="card" id="tc" hidden><div class="sc"><table id="tb"></table></div><div class="row"><button id="cp">Copy table (TSV)</button></div></div>
</main><script>
const RG=8.314,TORR=133.322,PW=[[0,.383],[1,.2417],[-1,.2417],[2,.0606],[-2,.0606],[3,.0079],[-3,.0079]],NT=10;
function parseROA(txt){const hdr={},pts=[];let c=null;
 for(const raw of txt.split(/\r?\n/)){const p=raw.split(',').map(s=>s.trim().replace(/^"|"$/g,''));if(!p[0])continue;
  if(p[0]==='Point'){c={n:+p[1],target:null,dose:null,t:[],P:[]};pts.push(c)}
  else if(p[0]==='Target'&&c)c.target=+p[1];
  else if(p[0]==='Dose'&&c)c.dose=+p[1];
  else if(c&&p.length>=2&&!isNaN(+p[0])&&!isNaN(+p[1])){c.t.push(+p[0]);c.P.push(+p[1])}
  else if(!c)hdr[p[0]]=p.slice(1).join(',')}
 return{hdr,pts}}
// Tm,Tr [K]; Vm,Vr [m3]; Pri [Torr]; returns moles taken up vs time
function uptake(pt,o){const k=o.Vr/(RG*o.Tr),m=o.Vm/(RG*o.Tm),n0=o.Pri*TORR*k+pt.P[0]*TORR*m;
 return pt.P.map(p=>n0-p*TORR*(k+m))}
// normalised uptake; F=D/R2 [1/s], s/R in nm
function model(t,F,R,s){return t.map(ti=>{let y=0;
 for(const[k,w]of PW){const f=F*R*R/((R+k*s)**2);let a=0;for(let n=1;n<=NT;n++)a+=Math.exp(-f*n*n*Math.PI**2*ti)/(n*n);y+=w*(1-6/Math.PI**2*a)}return y})}
function nelder(f,x0,st,it=3000){const n=x0.length;let S=[x0.slice()];
 for(let i=0;i<n;i++){const x=x0.slice();x[i]+=st[i];S.push(x)}
 let V=S.map(f);
 for(let k=0;k<it;k++){const o=V.map((v,i)=>i).sort((a,b)=>V[a]-V[b]);S=o.map(i=>S[i]);V=o.map(i=>V[i]);
  if(Math.abs(V[n]-V[0])<1e-15*(1+Math.abs(V[0])))break;
  const c=S[0].map((_,j)=>S.slice(0,n).reduce((a,x)=>a+x[j],0)/n),pt=(a)=>c.map((v,j)=>v+a*(S[n][j]-v));
  const xr=pt(-1),fr=f(xr);
  if(fr<V[0]){const xe=pt(-2),fe=f(xe);if(fe<fr){S[n]=xe;V[n]=fe}else{S[n]=xr;V[n]=fr}}
  else if(fr<V[n-1]){S[n]=xr;V[n]=fr}
  else{const xc=fr<V[n]?pt(-.5):pt(.5),fc=f(xc);
   if(fc<Math.min(fr,V[n])){S[n]=xc;V[n]=fc}else for(let i=1;i<=n;i++){S[i]=S[i].map((v,j)=>S[0][j]+.5*(v-S[0][j]));V[i]=f(S[i])}}}
 const b=V.indexOf(Math.min(...V));return{x:S[b],f:V[b]}}
// fit D/R2, M_inf (and optionally sigma, bounded 0..R/3). t,n: data with t>0
function fit(t,n,R,sig,fitSig){const Mn=n.slice(-10).reduce((a,b)=>a+b)/10*1e6,smax=R/3;
 const sg=x=>fitSig?Math.min(Math.max(x,0),smax):sig;
 const f=x=>{const F=Math.exp(x[0]),M=x[1];if(M<=0)return 1e9;const s=sg(x[2]),y=model(t,F,R,s);
  let e=0;for(let i=0;i<t.length;i++){const d=n[i]/(M*1e-6)-y[i];e+=d*d}return e};
 let best=null;
 for(const F0 of[1e-4,1e-3,3e-3,1e-2,3e-2,.1,.3]){let r=nelder(f,[Math.log(F0),Mn,fitSig?smax/2:0],[.5,Mn*.05,smax/4]);
  r=nelder(f,r.x,[.1,Mn*.01,smax/10]);if(!best||r.f<best.f)best=r}
 const F=Math.exp(best.x[0]),M=best.x[1],s=sg(best.x[2]);
 const y=model(t,F,R,s),yn=n.map(v=>v/(M*1e-6)),mu=yn.reduce((a,b)=>a+b)/yn.length,
  sst=yn.reduce((a,b)=>a+(b-mu)**2,0);
 return{F,M,s,sse:best.f,r2:1-best.f/sst,D:F*(R*1e-9)**2,y,yn}}


const $=i=>document.getElementById(i);let D=null,rows=[];
const fmt=(v,d=4)=>Number(v).toPrecision(d);
function load(txt){D=parseROA(txt);if(!D.pts.length){$('msg').textContent='No point data found in this file';return}
 $('cfg').hidden=false;$('sid').value=D.hdr['Sample ID']||'';$('wt').value=D.hdr['Sample Wt']||'';
 if(D.hdr['Analysis Bath'])$('tr').value=D.hdr['Analysis Bath'];if(D.hdr['Warm FS'])$('vr').value=D.hdr['Warm FS'];
 $('pt').innerHTML=D.pts.map((p,i)=>`<option value="${i}">${p.n}${p.n==1?'st':p.n==2?'nd':p.n==3?'rd':'th'}</option>`).join('');setPri();
 ['out','cc','tc'].forEach(i=>$(i).hidden=true);$('msg').textContent=`${D.pts.length}points loaded (interval ${D.hdr['Interval']||'?'} s)`}
function setPri(){const i=+$('pt').value;$('pri').value=i==0?0:D.pts[i-1].P.at(-1)}
function run(i,pri){const p=D.pts[i],o={Tm:+$('tm').value+273,Tr:+$('tr').value,Vm:+$('vm').value*1e-6,Vr:+$('vr').value*1e-6,Pri:pri};
 const n=uptake(p,o),k=p.t.findIndex(x=>x>0),t=p.t.slice(k),nn=n.slice(k),R=+$('R').value;
 const r=fit(t,nn,R,+$('sg').value,$('fs').checked);r.t=t;r.mmolg=r.M*1e-3/(+$('wt').value);r.pt=p.n;r.R=R;return r}
function show(r){$('out').hidden=false;$('cc').hidden=false;
 const c=[['D/R² (ks⁻¹)',fmt(r.F*1e3)],['D (m²/s)',r.D.toExponential(4)],['M∞ (µmol)',fmt(r.M)],['M∞ (mmol/g)',fmt(r.mmolg)],['σ (nm)',fmt(r.s,3)],['SSE',fmt(r.sse)],['R²',r.r2.toFixed(4)]];
 $('res').innerHTML=c.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');draw(r)}
function draw(r){const cv=$('cv'),dp=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dp;cv.height=H*dp;const g=cv.getContext('2d');g.scale(dp,dp);
 const cs=getComputedStyle(document.documentElement),L=48,B=30,T=10,Rr=12,tm=r.t.at(-1),ym=Math.max(1.1,...r.yn);
 const X=t=>L+t/tm*(W-L-Rr),Y=y=>H-B-y/ym*(H-B-T);g.font='11px sans-serif';g.strokeStyle=cs.getPropertyValue('--line');g.fillStyle=cs.getPropertyValue('--mut');
 for(let y=0;y<=1;y+=.25){g.beginPath();g.moveTo(L,Y(y));g.lineTo(W-Rr,Y(y));g.stroke();g.textAlign='right';g.fillText(y.toFixed(2),L-6,Y(y)+4)}
 g.textAlign='center';for(let i=0;i<=5;i++){const t=tm*i/5;g.fillText(Math.round(t),X(t),H-B+16)}g.fillText('time (s)',(L+W)/2,H-4);
 g.fillStyle=cs.getPropertyValue('--pt');r.t.forEach((t,i)=>{g.beginPath();g.arc(X(t),Y(r.yn[i]),2.2,0,7);g.fill()});
 g.strokeStyle=cs.getPropertyValue('--acc');g.lineWidth=2;g.beginPath();r.t.forEach((t,i)=>i?g.lineTo(X(t),Y(r.y[i])):g.moveTo(X(t),Y(r.y[i])));g.stroke()}
let last=null;$('go').onclick=()=>{$('msg').textContent='Fitting…';setTimeout(()=>{last=run(+$('pt').value,+$('pri').value);show(last);$('msg').textContent=''},20)};
$('all').onclick=()=>{$('msg').textContent='Fitting all points…';setTimeout(()=>{rows=D.pts.map((p,i)=>run(i,i==0?0:D.pts[i-1].P.at(-1)));
 const h=['Point','D/R² (ks⁻¹)','D (m²/s)','M∞ (µmol)','M∞ (mmol/g)','σ (nm)','SSE','R²'];
 $('tb').innerHTML='<tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.map(r=>`<tr><td>${r.pt}</td><td>${fmt(r.F*1e3)}</td><td>${r.D.toExponential(4)}</td><td>${fmt(r.M)}</td><td>${fmt(r.mmolg)}</td><td>${fmt(r.s,3)}</td><td>${fmt(r.sse)}</td><td>${r.r2.toFixed(4)}</td></tr>`).join('');
 $('tc').hidden=false;$('msg').textContent='';},20)};
$('cp').onclick=()=>navigator.clipboard.writeText([...$('tb').rows].map(r=>[...r.cells].map(c=>c.textContent).join('\t')).join('\n')).then(()=>$('cp').textContent='Copied',()=>{});
$('pt').onchange=setPri;
const dz=$('drop');dz.onclick=()=>$('fi').click();dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
const rd=f=>f&&f.text().then(load);dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');rd(e.dataTransfer.files[0])};$('fi').onchange=e=>rd(e.target.files[0]);
addEventListener('resize',()=>last&&draw(last));
</script></body></html>
